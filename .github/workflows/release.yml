name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-cli-release:
    name: Build release CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release CLI binary
        run: cargo build -p harflow-cli --release
      - name: Run workspace test verification
        run: cargo test --workspace
